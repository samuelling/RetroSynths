<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modem — RetroSynths</title>
<link rel="stylesheet" href="../../../common/app.css">
<link rel="stylesheet" href="modem.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 fill=%22%23008080%22/%3E%3Crect x=%223%22 y=%225%22 width=%2210%22 height=%226%22 fill=%22%23c0c0c0%22/%3E%3C/svg%3E">
<style>
  #start { display: block; margin: 40px auto; font-size: 14px; padding: 10px 24px; }
  #win { max-width: 1180px; }
</style>
</head>
<body>
<div id="desktop">
  <div class="window" id="win">
    <div class="titlebar"><h1 class="title" style="font-size:12px;margin:0">Modem — RetroSynths (standalone test page)</h1></div>
    <main class="body" style="display:block" id="host">
      <button type="button" class="btn" id="start">Power on the modem</button>
    </main>
    <div class="statusbar"><span id="status" aria-live="polite">Click to start audio.</span></div>
  </div>
</div>
<script type="module">
  import { mountModem } from './modem.js';
  const host = document.getElementById('host'), status = document.getElementById('status');
  let ctx = null;
  async function start() {
    if (ctx) return;
    ctx = new AudioContext({ latencyHint: 'interactive' });
    await ctx.resume().catch(() => {});
    document.getElementById('start').remove();
    window.modem = mountModem(host, { ctx, setStatus: (s) => { status.textContent = s; } });
    window.modemCtx = ctx;
    host.querySelector('.md-cmd').focus();
  }
  document.getElementById('start').addEventListener('click', start);
  if (new URLSearchParams(location.search).has('autostart')) start();
</script>
</body>
</html>
