<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>RetroSynths machine test</title></head>
<body><pre id="log"></pre>
<script type="module">
// Offline render harness for one machine. Driven by tests/run-machine.mjs.
import { demoSong } from '../common/demo.js';

const log = (s) => { document.getElementById('log').textContent += s + '\n'; };
const sr = 44100;

async function makeCtx(id, frames) {
  const ctx = new OfflineAudioContext(2, frames, sr);
  await ctx.audioWorklet.addModule(`./tmp/worklet-${id}.js`);
  const node = new AudioWorkletNode(ctx, 'host-' + id, { numberOfInputs: 0, numberOfOutputs: 1, outputChannelCount: [2] });
  node.connect(ctx.destination);
  const errors = [], stats = [];
  node.port.onmessage = (e) => {
    const d = e.data;
    if (d.t === 'error') errors.push(d.message);
    else if (d.t === 'stat') stats.push(d);
    else if (d.t === 'pong') node._pong && node._pong();
  };
  return { ctx, node, errors, stats };
}
async function prep(id, song) {
  let mod;
  try { mod = await import(`../common/machines/${id}.prep.js`); } catch { return null; }
  const fetchSF2 = async () => (await fetch('../soundfonts/GeneralUser-GS.sf2')).arrayBuffer();
  const t = performance.now();
  const data = await mod.prepare({ fetchSF2, song });
  log(`prep ${id}: ${Math.round(performance.now() - t)} ms`);
  return { data, transfer: mod.transfer ? mod.transfer(data) : [] };
}
function songInfo(song) {
  const programs = new Set(); let drums = false;
  const prog = new Array(16).fill(0);
  for (const e of song.events) {
    const ty = e[1] & 0xF0, c = e[1] & 15;
    if (ty === 0xC0) prog[c] = e[2];
    if (ty === 0x90 && e[3] > 0) { if (c === 9) drums = true; else programs.add(prog[c]); }
  }
  return { programs: [...programs], drums };
}
async function run(ctxo, id, events, p) {
  const { ctx, node, errors, stats } = ctxo;
  if (p) node.port.postMessage({ t: 'data', id, data: p.data }, p.transfer);
  node.port.postMessage({ t: 'machine', id });
  node.port.postMessage({ t: 'ev', ev: events });
  await new Promise(r => { node._pong = r; node.port.postMessage({ t: 'ping' }); });
  const t0 = performance.now();
  const buf = await ctx.startRendering();
  return { buf, ms: performance.now() - t0, errors, stats };
}
function measure(buf, a = 0, b = buf.length) {
  const L = buf.getChannelData(0), R = buf.getChannelData(1);
  let ss = 0, pk = 0, nan = 0, sd = 0;
  for (let i = a; i < b; i++) {
    const l = L[i], r = R[i];
    if (l !== l || r !== r) { nan++; continue; }
    ss += l * l + r * r; sd += (l - r) * (l - r);
    const m = Math.max(Math.abs(l), Math.abs(r)); if (m > pk) pk = m;
  }
  const n = Math.max(1, b - a);
  return { rmsDb: +(10 * Math.log10(ss / (2 * n) + 1e-12)).toFixed(1), peak: +pk.toFixed(3), nan, stereoDiffDb: +(10 * Math.log10(sd / n + 1e-12)).toFixed(1) };
}
function wav(buf) {
  const L = buf.getChannelData(0), R = buf.getChannelData(1), n = L.length;
  const b = new ArrayBuffer(44 + n * 4), d = new DataView(b);
  const ws = (o, s) => { for (let i = 0; i < s.length; i++) d.setUint8(o + i, s.charCodeAt(i)); };
  ws(0, 'RIFF'); d.setUint32(4, 36 + n * 4, true); ws(8, 'WAVE'); ws(12, 'fmt '); d.setUint32(16, 16, true); d.setUint16(20, 1, true); d.setUint16(22, 2, true);
  d.setUint32(24, sr, true); d.setUint32(28, sr * 4, true); d.setUint16(32, 4, true); d.setUint16(34, 16, true); ws(36, 'data'); d.setUint32(40, n * 4, true);
  for (let i = 0; i < n; i++) { d.setInt16(44 + i * 4, Math.max(-1, Math.min(1, L[i])) * 32767, true); d.setInt16(46 + i * 4, Math.max(-1, Math.min(1, R[i])) * 32767, true); }
  return b;
}

window.runDemo = async (id, seconds = 30, startAt = 8) => {
  const song = demoSong();
  const p = await prep(id, songInfo(song));
  const ev = [];
  for (const e of song.events) {
    if (e[0] < startAt) { const ty = e[1] & 0xF0; if (ty === 0xB0 || ty === 0xC0) ev.push([0, e[1], e[2], e[3]]); continue; }
    if (e[0] > startAt + seconds) break;
    ev.push([Math.round((e[0] - startAt) * sr) + 128, e[1], e[2], e[3]]);
  }
  const c = await makeCtx(id, Math.round(seconds * sr));
  const r = await run(c, id, ev, p);
  const maxVoices = Math.max(0, ...r.stats.map(s => s.voices));
  window._demoWav = wav(r.buf);
  return { id, seconds, realtimeX: +(seconds * 1000 / r.ms).toFixed(1), ...measure(r.buf), maxVoicesSeen: maxVoices, errors: r.errors };
};

window.runSweep = async (id) => {
  const slot = 0.6, n = 128 + 47;
  const p = await prep(id, { programs: [...Array(128).keys()], drums: true });
  const ev = [];
  for (let pr = 0; pr < 128; pr++) {
    const f = Math.round(pr * slot * sr) + 64, note = (pr >= 32 && pr < 40) || pr === 43 || pr === 58 ? 40 : 60;
    ev.push([f, 0xC0, pr, 0], [f + 1, 0x90, note, 100], [f + Math.round(0.4 * sr), 0x80, note, 0]);
  }
  for (let k = 0; k < 47; k++) {
    const f = Math.round((128 + k) * slot * sr) + 64;
    ev.push([f, 0x99, 35 + k, 100], [f + Math.round(0.3 * sr), 0x89, 35 + k, 0]);
  }
  const c = await makeCtx(id, Math.round(n * slot * sr));
  const r = await run(c, id, ev, p);
  const melodic = [], drums = [];
  for (let s = 0; s < n; s++) {
    const m = measure(r.buf, Math.round(s * slot * sr), Math.round((s * slot + 0.45) * sr));
    (s < 128 ? melodic : drums).push(m.rmsDb);
  }
  window._sweepWav = wav(r.buf);
  return { id, melodic, drums, errors: r.errors, nan: measure(r.buf).nan };
};
</script>
</body></html>
